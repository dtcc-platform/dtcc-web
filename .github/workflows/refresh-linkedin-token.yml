name: Refresh LinkedIn Token

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh token
        env:
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python3 scripts/linkedin_token_refresh.py

      - name: Summary
        if: always()
        run: |
          echo "## LinkedIn Token Refresh" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Token renewal succeeded. Each import renews its own access token in memory; no secret update is needed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Token renewal failed. Check the failed step. An expired or revoked refresh token requires local reauthorization and an update to LINKEDIN_REFRESH_TOKEN." >> $GITHUB_STEP_SUMMARY
          fi

name: Keep scheduled workflows active

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: repository-content-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Test keepalive
        run: python3 -B -m unittest discover -s scripts/tests -p test_workflow_keepalive.py -v

      - name: Record activity if the repository has been quiet
        run: bash scripts/workflow_keepalive.sh
